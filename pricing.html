    <script>
        // Use Global navigate function defined in main scripts
        function navigate(url) {
            const curtain = document.getElementById('curtain');
            if (curtain) {
                curtain.classList.remove('rising');
                curtain.classList.add('falling');
                setTimeout(() => {
                    window.location.href = url;
                }, 600);
            } else {
                window.location.href = url;
            }
        }

        // Initialize theme
        (function() {
            const theme = localStorage.getItem('huggy-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        })();

        window.addEventListener('load', () => {
            const curtain = document.getElementById('curtain');
            if (curtain) curtain.classList.add('rising');
        });

        // Toggle Billing
        function setBilling(mode) {
            const buttons = document.querySelectorAll('.toggle-btn');
            const pricePro = document.getElementById('price-pro');
            const priceTeam = document.getElementById('price-team');

            buttons.forEach(b => b.classList.remove('active'));
            if (mode === 'monthly') {
                buttons[0].classList.add('active');
                pricePro.innerHTML = '29€ <span>/mois</span>';
                priceTeam.innerHTML = '99€ <span>/mois</span>';
            } else {
                buttons[1].classList.add('active');
                pricePro.innerHTML = '23,20€ <span>/mois</span>';
                priceTeam.innerHTML = '79,20€ <span>/mois</span>';
            }
        }

        // FAQ Toggle
        document.querySelectorAll('.faq-q').forEach(q => {
            q.addEventListener('click', () => {
                q.parentElement.classList.toggle('open');
            });
        });

        // Theme Toggle Logic
        const themeBtn = document.getElementById('theme-btn');
        const html = document.documentElement;
        themeBtn.addEventListener('click', () => {
            const current = html.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('huggy-theme', next);
            
            // Update icons visibility
            const moon = document.getElementById('moon-icon');
            const sun = document.getElementById('sun-icon');
            if (next === 'dark') {
                moon.style.display = 'block';
                sun.style.display = 'none';
            } else {
                moon.style.display = 'none';
                sun.style.display = 'block';
            }
        });
        
        // Finalize icons based on load theme
        document.addEventListener('DOMContentLoaded', () => {
            const current = html.getAttribute('data-theme');
            const moon = document.getElementById('moon-icon');
            const sun = document.getElementById('sun-icon');
            if (current === 'dark') {
                moon.style.display = 'block';
                sun.style.display = 'none';
            } else {
                moon.style.display = 'none';
                sun.style.display = 'block';
            }
        });
    </script>
