<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Huggy — Authentication</title>
    <script>
        (function() {
            const theme = localStorage.getItem('huggy-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@300;400;500;600&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
    <style>
        @import "tailwindcss";

        :root[data-theme="dark"] {
            --bg: #060606;
            --bg-surface: #0F0F0F;
            --bg-elevated: #161616;
            --bg-input: #111111;
            --accent: #F0EBE3;
            --accent-dim: rgba(240, 235, 227, 0.07);
            --accent-hover: rgba(240, 235, 227, 0.11);
            --text: #F2F2F2;
            --text-muted: #606060;
            --text-sub: #2E2E2E;
            --border: rgba(255, 255, 255, 0.06);
            --border-focus: rgba(240, 235, 227, 0.22);
            --error: #F87171;
        }

        :root[data-theme="light"] {
            --bg: #F8F5F0;
            --bg-surface: #FFFFFF;
            --bg-elevated: #F0EDE8;
            --bg-input: #FFFFFF;
            --accent: #0C0C0C;
            --accent-dim: rgba(12, 12, 12, 0.06);
            --accent-hover: rgba(12, 12, 12, 0.10);
            --text: #0C0C0C;
            --text-muted: #888888;
            --text-sub: #BBBBBB;
            --border: rgba(0, 0, 0, 0.08);
            --border-focus: rgba(12, 12, 12, 0.25);
            --error: #DC2626;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: "Inter", "Instrument Sans", sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }

        /* Noise effect */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0.025;
            background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");
            background-repeat: repeat;
            background-size: 200px 200px;
        }
        [data-theme="light"] body::before { opacity: 0.018; }

        #curtain {
            position: fixed;
            inset: 0;
            z-index: 9999;
            pointer-events: none;
            transform-origin: top;
            transform: scaleY(0);
            will-change: transform;
            background: var(--bg);
        }
        #curtain.rising {
            transition: transform 600ms cubic-bezier(0.82, 0, 0.18, 1);
            transform: scaleY(0);
            transform-origin: bottom;
        }
        #curtain.falling {
            transition: transform 600ms cubic-bezier(0.82, 0, 0.18, 1);
            transform: scaleY(1);
            transform-origin: top;
            pointer-events: all;
        }

        .auth-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            animation: fadeIn 600ms cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-area {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-mark {
            display: inline-flex;
            width: 48px;
            height: 48px;
            background: var(--text);
            border-radius: 12px;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }

        .auth-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .auth-header {
            margin-bottom: 32px;
            text-align: center;
        }

        .auth-title {
            font-family: "Instrument Serif", serif;
            font-size: 32px;
            font-style: italic;
            margin-bottom: 8px;
        }

        .auth-subtitle {
            font-size: 14px;
            color: var(--text-muted);
        }

        .tabs {
            display: flex;
            background: var(--bg-input);
            padding: 4px;
            border-radius: 10px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
        }

        .tab-btn {
            flex: 1;
            padding: 8px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            transition: all 200ms;
            cursor: pointer;
            text-align: center;
            border: none;
            background: none;
        }

        .tab-btn.active {
            background: var(--bg-surface);
            color: var(--text);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border: 1px solid var(--border);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 8px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 14px;
            transition: all 200ms;
        }

        .input:focus {
            outline: none;
            border-color: var(--border-focus);
            box-shadow: 0 0 0 4px var(--accent-dim);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: var(--bg);
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            margin-top: 12px;
            transition: all 200ms;
            cursor: pointer;
        }

        .btn-submit:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .social-divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: var(--text-sub);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .social-divider::before, .social-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .social-divider span {
            padding: 0 16px;
        }

        .social-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-social {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg-input);
            color: var(--text);
            font-size: 13px;
            font-weight: 500;
            transition: all 200ms;
            cursor: pointer;
        }

        .btn-social:hover {
            background: var(--accent-dim);
            border-color: var(--border-focus);
        }

        .auth-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
        }

        .auth-footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        /* Theme toggle floating */
        .theme-toggle {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            cursor: pointer;
            z-index: 100;
            transition: all 200ms;
        }

        .theme-toggle:hover {
            border-color: var(--border-focus);
            transform: scale(1.05);
        }

        .hidden { display: none !important; }

        /* Animation related */
        .slide-up {
            animation: slideUp 400ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div id="curtain"></div>

    <button class="theme-toggle" id="theme-btn" title="Toggle Theme">
        <svg id="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <svg id="sun-icon" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
    </button>

    <div class="auth-container">
        <div class="logo-area">
            <div class="logo-mark">
                <svg width="24" height="24" viewBox="0 0 32 32" fill="none">
                    <rect width="32" height="32" rx="0" fill="var(--bg)"/>
                    <path d="M16 8L25 13.5V14.5L16 9.5L7 14.5V13.5L16 8Z" fill="var(--accent)"/>
                    <path d="M7 16.5V24.5L11.5 22V14L7 16.5Z" fill="var(--accent)"/>
                    <path d="M25 16.5V24.5L16 24.5V22H20.5V14L25 16.5Z" fill="var(--accent)"/>
                </svg>
            </div>
        </div>

        <div class="auth-card">
            <div class="auth-header">
                <h1 class="auth-title" id="auth-title">Welcome back</h1>
                <p class="auth-subtitle" id="auth-subtitle">Enter your details to access your workspace</p>
            </div>

            <div class="tabs">
                <button class="tab-btn active" id="tab-login">Log In</button>
                <button class="tab-btn" id="tab-signup">Sign Up</button>
            </div>

            <form id="auth-form">
                <div class="form-group" id="name-group" style="display:none;">
                    <label class="label">Full Name</label>
                    <input type="text" class="input" placeholder="John Doe" id="input-name">
                </div>
                <div class="form-group">
                    <label class="label">Email Address</label>
                    <input type="email" class="input" placeholder="name@company.com" required id="input-email">
                </div>
                <div class="form-group">
                    <label class="label">Password</label>
                    <input type="password" class="input" placeholder="••••••••" required id="input-password">
                </div>
                
                <button type="submit" class="btn-submit" id="btn-submit">Sign In</button>
            </form>

            <div class="social-divider">
                <span>or continue with</span>
            </div>

            <div class="social-btns">
                <button class="btn-social" id="btn-google">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12.48 10.92v3.28h7.84c-.24 1.84-.901 3.38-2.651 4.581-2.091 1.421-4.791 2.231-7.671 2.231-6.13 0-11.23-3.871-11.23-10.05s5.11-10.04 11.23-10.04c3.281 0 6.041 1.2 8.16 3.19l-2.451 2.451C14.891 5.58 13.78 5.11 12.48 5.11c-2.901 0-5.61 1.7-6.53 4.291-.18.52-.28 1.07-.28 1.63s.101 1.11.27 1.63c.921 2.59 3.63 4.29 6.531 4.29 1.811 0 3.3-.42 4.491-1.251 1.171-.831 2.05-2.01 2.371-3.66h-6.861z"/>
                    </svg>
                    Google
                </button>
                <button class="btn-social" id="btn-github">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
                    </svg>
                    GitHub
                </button>
            </div>

            <div class="auth-footer" id="auth-footer-text">
                Don't have an account? <a href="#" id="link-signup">Sign up for free</a>
            </div>
        </div>
    </div>

    <script type="module" src="/src/auth.ts"></script>
</body>
</html>
