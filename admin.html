<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Huggy Admin Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/index.css">
  <style>
    body {
      background:
        radial-gradient(circle at 12% 0%, color-mix(in srgb, var(--accent-blue) 12%, transparent), transparent 32%),
        var(--bg);
      min-height: 100vh;
    }

    .admin-shell {
      display: grid;
      grid-template-columns: 248px minmax(0, 1fr);
      min-height: 100vh;
    }

    .admin-sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 18px;
      border-right: 1px solid var(--border);
      background: color-mix(in srgb, var(--bg-surface) 78%, transparent);
      backdrop-filter: blur(18px);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .admin-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      font-weight: 850;
      letter-spacing: -0.04em;
      text-decoration: none;
      font-size: 22px;
    }

    .admin-brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: var(--accent);
      color: var(--bg);
      font: 900 13px/1 "JetBrains Mono", monospace;
    }

    .admin-nav {
      display: grid;
      gap: 6px;
    }

    .admin-nav button,
    .admin-return {
      min-height: 38px;
      padding: 0 12px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-sub);
      text-decoration: none;
      font-size: 13px;
      font-weight: 760;
      border: 1px solid transparent;
      transition: background 160ms ease, color 160ms ease, border-color 160ms ease;
    }

    .admin-nav button:hover,
    .admin-nav button.active,
    .admin-return:hover {
      background: var(--bg-elevated);
      color: var(--text);
      border-color: var(--border);
    }

    .admin-main {
      padding: 26px clamp(18px, 3vw, 36px) 56px;
      min-width: 0;
    }

    .admin-topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 24px;
    }

    .admin-kicker {
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent-blue);
      font-weight: 800;
      margin-bottom: 8px;
    }

    .admin-title {
      font-size: clamp(30px, 4vw, 54px);
      line-height: 0.94;
      letter-spacing: -0.065em;
      max-width: 820px;
    }

    .admin-subtitle {
      color: var(--text-muted);
      max-width: 720px;
      line-height: 1.55;
      margin-top: 12px;
      font-size: 15px;
    }

    .admin-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .admin-button {
      height: 38px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--text);
      background: var(--bg-surface);
      font-weight: 780;
      font-size: 12px;
    }

    .admin-button.primary {
      background: var(--accent-blue);
      border-color: var(--accent-blue);
      color: #fff;
    }

    .admin-grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 12px;
    }

    .admin-card {
      grid-column: span 4;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: color-mix(in srgb, var(--bg-surface) 86%, transparent);
      padding: 16px;
      min-width: 0;
      box-shadow: 0 20px 70px -58px rgba(0, 0, 0, 0.45);
    }

    .admin-card.wide { grid-column: span 8; }
    .admin-card.full { grid-column: 1 / -1; }

    .metric-label,
    .panel-label {
      color: var(--text-sub);
      font-size: 11px;
      font-family: "JetBrains Mono", monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 800;
    }

    .metric-value {
      display: block;
      margin-top: 12px;
      font-size: 34px;
      line-height: 1;
      letter-spacing: -0.055em;
      font-weight: 850;
    }

    .metric-note {
      display: block;
      color: var(--text-muted);
      font-size: 12px;
      margin-top: 8px;
      line-height: 1.45;
    }

    .admin-section {
      display: none;
      animation: adminReveal 220ms ease both;
    }

    .admin-section.active {
      display: block;
    }

    .admin-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .admin-search {
      width: min(360px, 100%);
      height: 40px;
      border: 1px solid var(--border);
      background: var(--bg-input);
      color: var(--text);
      border-radius: 999px;
      padding: 0 14px;
      outline: none;
    }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .admin-table th {
      color: var(--text-sub);
      font: 800 10px/1 "JetBrains Mono", monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: left;
      padding: 10px 8px;
      border-bottom: 1px solid var(--border);
    }

    .admin-table td {
      padding: 12px 8px;
      color: var(--text-muted);
      border-bottom: 1px solid color-mix(in srgb, var(--border) 66%, transparent);
      vertical-align: top;
    }

    .admin-table strong {
      color: var(--text);
      font-weight: 780;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 24px;
      padding: 0 9px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--text-muted);
      background: var(--bg-elevated);
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .status-pill::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: currentColor;
    }

    .status-pill.ok,
    .status-pill.ready,
    .status-pill.completed,
    .status-pill.published { color: #34d399; }

    .status-pill.warning,
    .status-pill.draft,
    .status-pill.running { color: #fbbf24; }

    .status-pill.failed,
    .status-pill.error,
    .status-pill.blocked { color: #fb7185; }

    .health-list,
    .flag-list {
      display: grid;
      gap: 8px;
    }

    .health-row,
    .flag-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--bg-elevated);
    }

    .health-row span,
    .flag-row span {
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .admin-empty,
    .admin-error {
      padding: 18px;
      border: 1px dashed var(--border);
      border-radius: 14px;
      color: var(--text-muted);
      background: var(--bg-surface);
      line-height: 1.55;
    }

    .admin-error {
      color: #fca5a5;
    }

    .admin-drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: min(520px, 100%);
      height: 100vh;
      z-index: 70;
      padding: 20px;
      background: var(--bg-surface);
      border-left: 1px solid var(--border);
      transform: translateX(102%);
      transition: transform 220ms ease;
      box-shadow: -28px 0 80px rgba(0, 0, 0, 0.24);
      overflow: auto;
    }

    .admin-drawer.open {
      transform: translateX(0);
    }

    .drawer-close {
      float: right;
      color: var(--text-sub);
      font-size: 24px;
    }

    .support-summary {
      white-space: pre-wrap;
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      line-height: 1.55;
      color: var(--text-muted);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
    }

    @keyframes adminReveal {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 980px) {
      .admin-shell {
        grid-template-columns: 1fr;
      }

      .admin-sidebar {
        position: static;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }

      .admin-nav {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .admin-topbar {
        flex-direction: column;
      }

      .admin-actions {
        justify-content: flex-start;
      }

      .admin-card,
      .admin-card.wide {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <a class="admin-brand" href="/dashboard.html" aria-label="Back to dashboard">
        <span class="admin-brand-mark">H</span>
        <span>Huggy Admin</span>
      </a>
      <nav class="admin-nav" aria-label="Admin sections">
        <button class="active" data-admin-tab="overview" type="button">Overview <span>01</span></button>
        <button data-admin-tab="users" type="button">Users <span>02</span></button>
        <button data-admin-tab="projects" type="button">Projects <span>03</span></button>
        <button data-admin-tab="runs" type="button">Runs <span>04</span></button>
        <button data-admin-tab="errors" type="button">Errors <span>05</span></button>
        <button data-admin-tab="models" type="button">Models <span>06</span></button>
        <button data-admin-tab="publish" type="button">Publish <span>07</span></button>
        <button data-admin-tab="security" type="button">Security <span>08</span></button>
        <button data-admin-tab="flags" type="button">Flags <span>09</span></button>
        <button data-admin-tab="support" type="button">Support <span>10</span></button>
      </nav>
      <a class="admin-return" href="/dashboard.html">Go to Dashboard <span>→</span></a>
    </aside>

    <main class="admin-main">
      <header class="admin-topbar">
        <div>
          <p class="admin-kicker">Platform operations</p>
          <h1 class="admin-title">Control Huggy without touching production code.</h1>
          <p class="admin-subtitle">Observe users, projects, runs, billing, publish, model health, security and support signals from one redacted, admin-only console.</p>
        </div>
        <div class="admin-actions">
          <button class="admin-button" id="admin-refresh" type="button">Refresh</button>
          <button class="admin-button primary" id="admin-copy-summary" type="button">Copy ops summary</button>
        </div>
      </header>

      <section class="admin-section active" data-section="overview">
        <div id="admin-overview" class="admin-grid"></div>
      </section>

      <section class="admin-section" data-section="users">
        <div class="admin-card full">
          <div class="admin-panel-head">
            <span class="panel-label">Users</span>
            <input id="admin-user-search" class="admin-search" placeholder="Search email or user id" />
          </div>
          <div id="admin-users"></div>
        </div>
      </section>

      <section class="admin-section" data-section="projects">
        <div class="admin-card full">
          <div class="admin-panel-head">
            <span class="panel-label">Projects</span>
            <input id="admin-project-search" class="admin-search" placeholder="Search project, owner or id" />
          </div>
          <div id="admin-projects"></div>
        </div>
      </section>

      <section class="admin-section" data-section="runs">
        <div id="admin-runs" class="admin-grid"></div>
      </section>

      <section class="admin-section" data-section="errors">
        <div id="admin-errors" class="admin-grid"></div>
      </section>

      <section class="admin-section" data-section="models">
        <div id="admin-models" class="admin-grid"></div>
      </section>

      <section class="admin-section" data-section="publish">
        <div id="admin-publish" class="admin-grid"></div>
      </section>

      <section class="admin-section" data-section="security">
        <div id="admin-security" class="admin-grid"></div>
      </section>

      <section class="admin-section" data-section="flags">
        <div id="admin-flags" class="admin-grid"></div>
      </section>

      <section class="admin-section" data-section="support">
        <div class="admin-card full">
          <div class="admin-panel-head">
            <span class="panel-label">Support workspace</span>
            <button class="admin-button" id="admin-build-support-summary" type="button">Build support summary</button>
          </div>
          <div id="admin-support"></div>
        </div>
      </section>
    </main>
  </div>

  <aside id="admin-drawer" class="admin-drawer" aria-live="polite">
    <button class="drawer-close" id="admin-drawer-close" type="button" aria-label="Close">×</button>
    <div id="admin-drawer-content"></div>
  </aside>

  <script type="module" src="/src/auth-guard.ts"></script>
  <script type="module" src="/src/admin-live.ts"></script>
</body>
</html>
